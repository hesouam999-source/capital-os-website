name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure optional Google Analytics 4
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
        run: |
          if [[ "$GA4_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]]; then
            printf 'window.CapitalOSAnalyticsConfig = { measurementId: "%s" };\n' "$GA4_MEASUREMENT_ID" > analytics-config.js
          else
            printf 'window.CapitalOSAnalyticsConfig = { measurementId: "" };\n' > analytics-config.js
          fi

      - name: Configure optional private feedback form
        env:
          FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          if [[ "$FEEDBACK_ENDPOINT" == "https://capital-os-feedback.hesouam999.workers.dev/v1/feedback" && "$TURNSTILE_SITE_KEY" == "0x4AAAAAAFaj57TEqV5urBoS" ]]; then
            printf 'window.CapitalOSFeedbackConfig = { endpoint: "%s", turnstileSiteKey: "%s" };\n' "$FEEDBACK_ENDPOINT" "$TURNSTILE_SITE_KEY" > feedback-config.js
          else
            printf 'window.CapitalOSFeedbackConfig = { endpoint: "", turnstileSiteKey: "" };\n' > feedback-config.js
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
